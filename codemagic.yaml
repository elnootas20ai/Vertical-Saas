# Pipeline de build iOS en la nube (Codemagic) — compila, firma y sube a TestFlight
# sin necesidad de un Mac local.
#
# Requisitos previos (una sola vez, ver instrucciones en el chat / readme):
#   1. Cuenta Apple Developer de pago activa.
#   2. API key de App Store Connect (archivo .p8) añadida en Codemagic como
#      integración con el nombre "vertial-asc" (Teams > Integrations > Developer Portal).
#   3. App creada en App Store Connect con bundle ID com.vertial.app.
#   4. Repo conectado en Codemagic (login con GitHub).

workflows:
  ios-release:
    name: iOS Release (TestFlight)
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: vertial-asc
    environment:
      node: 22
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.vertial.app
      vars:
        # El WebView nativo no comparte origen con el backend: URL absoluta del API
        VITE_NATIVE_API_ORIGIN: "https://vertialapp.com"
        # Tablets tienda: WebView carga prod; deploy web = update sin nuevo IPA
        CAPACITOR_SERVER_URL: "https://vertialapp.com"
    scripts:
      - name: Instalar dependencias
        script: |
          set -e
          # sharp/@capacitor/assets son optional: si GitHub libvips da 503, npm ci no tumba el IPA.
          # Iconos iOS ya van en el repo; no regeneramos assets en CI.
          for attempt in 1 2 3; do
            echo "npm ci intento $attempt…"
            if npm ci --no-audit --no-fund; then
              exit 0
            fi
            echo "npm ci falló (intento $attempt). Reintento en 20s…"
            sleep 20
          done
          exit 1
      - name: Build web de producción
        script: npm run build
      - name: Sincronizar Capacitor iOS (live URL tienda)
        script: |
          set -e
          echo "CAPACITOR_SERVER_URL=$CAPACITOR_SERVER_URL"
          # capacitor.config.ts necesita typescript en node_modules (devDependency).
          if ! node -e "require('typescript')"; then
            echo "ERROR: falta el paquete typescript. Añádelo con: npm i -D typescript"
            exit 1
          fi
          export COCOAPODS_DISABLE_STATS=true
          # GitHub a veces da 503 al bajar IONGeolocationLib (Capacitor Geolocation).
          ION_URL="https://github.com/ionic-team/ion-ios-geolocation/releases/download/2.1.0/IONGeolocationLib.zip"
          for attempt in 1 2 3 4 5 6; do
            echo "Pre-descarga IONGeolocationLib intento $attempt…"
            if curl -fL --retry 4 --retry-all-errors --retry-delay 8 \
              --connect-timeout 30 --max-time 180 \
              -o "${TMPDIR:-/tmp}/IONGeolocationLib.zip" "$ION_URL"; then
              ls -la "${TMPDIR:-/tmp}/IONGeolocationLib.zip"
              break
            fi
            if [ "$attempt" -eq 6 ]; then
              echo "WARNING: pre-descarga falló; pod install reintentará igual"
            else
              sleep $((attempt * 15))
            fi
          done
          SYNC_OK=0
          for attempt in 1 2 3 4 5 6; do
            echo "cap sync ios intento $attempt…"
            if npx cap sync ios; then
              SYNC_OK=1
              break
            fi
            echo "cap sync falló (suele ser CocoaPods/GitHub 503). Reintento en $((attempt * 20))s…"
            sleep $((attempt * 20))
          done
          if [ "$SYNC_OK" -ne 1 ]; then
            echo "ERROR: cap sync ios falló tras varios reintentos"
            exit 1
          fi
          echo "=== capacitor.config.json (iOS) ==="
          if [ ! -f ios/App/App/capacitor.config.json ]; then
            echo "ERROR: cap sync no generó ios/App/App/capacitor.config.json"
            ls -la ios/App/App/ || true
            exit 1
          fi
          cat ios/App/App/capacitor.config.json
      - name: Instalar pods
        script: |
          set -e
          cd ios/App
          export COCOAPODS_DISABLE_STATS=true
          for attempt in 1 2 3 4 5 6; do
            echo "pod install intento $attempt…"
            if pod install; then
              exit 0
            fi
            echo "pod install falló (GitHub 503?). Reintento en $((attempt * 20))s…"
            sleep $((attempt * 20))
          done
          exit 1
      - name: Versión de marketing + build incremental
        script: |
          set -e
          cd ios/App
          # Marketing: sube cuando hay cambio de producto tablet.
          agvtool new-marketing-version 1.12
          # Build: mayor que el último en TestFlight (si no, Apple rechaza el upload).
          LATEST_TF=""
          LATEST_TF=$(app-store-connect get-latest-testflight-build-number com.vertial.app 2>/dev/null || true)
          CM_BUILD="${BUILD_NUMBER:-1}"
          NEXT="$CM_BUILD"
          if [ -n "$LATEST_TF" ] && [ "$LATEST_TF" -eq "$LATEST_TF" ] 2>/dev/null; then
            CAND=$((LATEST_TF + 1))
            if [ "$CAND" -gt "$NEXT" ]; then
              NEXT="$CAND"
            fi
          fi
          agvtool new-version -all "$NEXT"
          echo "Marketing: $(agvtool what-marketing-version -terse1)  Build: $(agvtool what-version -terse) (TF last=$LATEST_TF CM=$CM_BUILD)"
      - name: Diagnóstico firma (perfil vs entitlements)
        script: |
          set -e
          echo "=== App.entitlements (repo) ==="
          cat ios/App/App/App.entitlements
          echo "=== Identidades en keychain ==="
          security find-identity -v -p codesigning || true
          echo "=== Perfiles descargados en la máquina ==="
          ls -la "$HOME/Library/MobileDevice/Provisioning Profiles" || true
          for p in "$HOME/Library/MobileDevice/Provisioning Profiles"/*.mobileprovision; do
            [ -f "$p" ] || continue
            echo "--- PROFILE: $(basename "$p") ---"
            security cms -D -i "$p" 2>/dev/null | plutil -extract Name raw -o - - 2>/dev/null || true
            security cms -D -i "$p" 2>/dev/null | plutil -extract Entitlements xml1 -o - - 2>/dev/null || true
          done
      - name: Aplicar perfiles de firma
        script: xcode-project use-profiles
      - name: Compilar IPA
        script: |
          set -e
          xcode-project build-ipa \
            --workspace ios/App/App.xcworkspace \
            --scheme App \
            --archive-flags="-allowProvisioningUpdates -verbose" || {
              echo "=== DIAGNOSTICO ERROR (líneas útiles) ==="
              for LOG in $(ls -t /tmp/xcodebuild_logs/*.log 2>/dev/null); do
                echo "--- $LOG ---"
                grep -E "error:|ERROR |Provisioning|entitlement|CodeSign|codesign|Failed to|requires a provisioning|does not support|exit code" "$LOG" | tail -100 || true
                echo "=== tail 40 ==="
                tail -40 "$LOG"
              done
              echo "=== App.entitlements ==="
              cat ios/App/App/App.entitlements
              exit 65
            }
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        # Si hay un build viejo en review de TestFlight, no bloquear el nuevo.
        expire_build_submitted_for_review: true
