# Ejemplo Nginx: HTTPS en vertialapp.com, estáticos del build Vite y API en Node.
# Copiar a /etc/nginx/sites-available/ y enlazar en sites-enabled; ajusta ssl_certificate y root.
#
# Build del front (misma API en el mismo dominio vía /api):
#   VITE_API_URL vacío o https://vertialapp.com — npm run build
# Subir el contenido de dist/ a la carpeta "root" (p. ej. /var/www/vertial/dist).
#
# Backend: PORT debe coincidir con proxy_pass (3000 o 3001 según tu .env en el VPS).

server {
    listen 80;
    listen [::]:80;
    server_name vertialapp.com www.vertialapp.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name vertialapp.com www.vertialapp.com;

    # ssl_certificate     /etc/letsencrypt/live/vertialapp.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/vertialapp.com/privkey.pem;

    root /var/www/vertial/dist;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    # SSE (Server-Sent Events) — streaming en tiempo real.
    # MUY IMPORTANTE: buffering, cache y gzip OFF, y timeouts largos
    # para que los eventos lleguen sin acumular y no se corte la conexión.
    location /api/sse {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        chunked_transfer_encoding off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location /api {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        client_max_body_size 50m;
        proxy_next_upstream error timeout http_502 http_503;
        proxy_next_upstream_tries 2;
        proxy_next_upstream_timeout 10s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
