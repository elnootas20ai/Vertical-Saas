# Ejemplo Nginx: HTTPS en udaredge.com, estáticos del build Vite y API en Node (puerto 3001).
# Copiar a /etc/nginx/sites-available/ y enlazar en sites-enabled; ajustar rutas ssl_certificate y root.
#
# Build del front (en tu máquina o CI):
#   set VITE_API_URL=https://api.udaredge.com && npm run build
# Subir el contenido de dist/ a la carpeta que uses en "root" abajo.
#
# En el servidor: CouchDB + Node con .env.production (PORT=3001, ALLOWED_ORIGINS con https://udaredge.com,...)

server {
    listen 80;
    listen [::]:80;
    server_name udaredge.com www.udaredge.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name udaredge.com www.udaredge.com;

    # ssl_certificate     /etc/letsencrypt/live/udaredge.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/udaredge.com/privkey.pem;

    root /var/www/udaredge/dist;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    # API Node (Express): todas las rutas /api/* -> mismo path en 127.0.0.1:3001
    location /api {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        client_max_body_size 50m;
    }

    # SPA: rutas del cliente React
    location / {
        try_files $uri $uri/ /index.html;
    }
}
