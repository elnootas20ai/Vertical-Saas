# Nginx: HTTPS + SPA estática + API en el mismo servidor (Docker).
# - Frontend (dist): lo sirve directamente Nginx (mejor performance/cache)
# - Backend (/api/*): reverse proxy a Node en 127.0.0.1:3000
#
# Requisitos:
# - Certificados TLS (Let's Encrypt) configurados en las rutas indicadas
# - dist/ subido a /var/www/vertial/dist (o ajusta root)
#
# Nota: el backend también puede servir dist, pero aquí lo optimizamos.

server {
    listen 80;
    listen [::]:80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name _;

    # ssl_certificate     /etc/letsencrypt/live/tu-dominio/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/tu-dominio/privkey.pem;

    root /var/www/vertial/dist;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    # SSE (Server-Sent Events) — streaming en tiempo real.
    # MUY IMPORTANTE: buffering, cache y gzip OFF, y timeouts largos
    # para que los eventos lleguen sin acumular y no se corte la conexión.
    location /api/sse {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        chunked_transfer_encoding off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location /api {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
        client_max_body_size 50m;
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
