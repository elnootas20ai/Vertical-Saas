# Vertial — CouchDB + API (solo ejecución; el build ocurre en CI o en tu PC).
#
# Uso recomendado (raíz del repo, con `.env` al lado de `deploy/`):
#   docker compose -f deploy/docker-compose.scaleway.yml --env-file .env up -d --build
#
# El bloque `env_file` del servicio `app` inyecta TODO el `.env` en el contenedor.
# Las claves del bloque `environment` prevalecen sobre el archivo (Docker Compose):
#   - NODE_ENV / PORT: runtime fijo
#   - COUCHDB_URL: dentro de la red Docker debe ser el hostname del servicio `couchdb`,
#     no 127.0.0.1 ni la IP pública. En el host, para scripts (npm run saas:bootstrap) sigue
#     usando en línea: COUCHDB_URL=http://127.0.0.1:5984 …
#   - NODE_OPTIONS: debe ser seguro dentro del contenedor: los `--import` / `--require` del .env
#     local (o rutas de depuración) no existen en la imagen y Pino 10 (workers) puede abortar
#     el proceso al arrancar. Ajusta heap con NODE_MAX_OLD_SPACE_MB en `.env` si hace falta.
# Si Couch está fuera de este Compose, pon en `.env`: COUCHDB_URL_APP=http://host:5984

services:
  couchdb:
    image: couchdb:3.4
    restart: unless-stopped
    environment:
      COUCHDB_USER: ${COUCHDB_USER}
      COUCHDB_PASSWORD: ${COUCHDB_PASSWORD}
    # La imagen couchdb:3.4 no deja `curl` instalado; comprobar el puerto con bash (debian-slim).
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/5984'"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 25s
    volumes:
      - couchdb_data:/opt/couchdb/data
      - couchdb_etc:/opt/couchdb/etc/local.d
    # Solo localhost (más seguro, Fauxton vía SSH -L): "127.0.0.1:5984:5984"
    # Acceso Fauxton desde Internet (abrir 5984 en firewall del proveedor + ufw si aplica):
    ports:
      - "5984:5984"

  app:
    build:
      context: ..
      # VPS con poco disco: usa Dockerfile.prebuilt (sin npm run build ni devDependencies).
      # Requiere dist/ presente en el repo (git pull) o el build fallará.
      dockerfile: deploy/Dockerfile.prebuilt
    restart: unless-stopped
    depends_on:
      couchdb:
        condition: service_healthy
    env_file:
      - ../.env
    environment:
      NODE_ENV: production
      PORT: "3000"
      COUCHDB_URL: ${COUCHDB_URL_APP:-http://couchdb:5984}
      NODE_OPTIONS: "--max-old-space-size=${NODE_MAX_OLD_SPACE_MB:-1024}"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:'+(process.env.PORT||3000)+'/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s
    ports:
      - "127.0.0.1:3000:3000"
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    # Reserva mínima; el VPS tiene ~8 GB — no limitar fuerte para 5–20 usuarios concurrentes.
    deploy:
      resources:
        reservations:
          memory: 256M

volumes:
  couchdb_data:
  couchdb_etc:
