# Vertial — CouchDB + API (solo ejecución; el build ocurre en CI o en tu PC).
#
# Uso recomendado (raíz del repo, con `.env` al lado de `deploy/`):
#   docker compose -f deploy/docker-compose.scaleway.yml --env-file .env up -d --build
#
# El bloque `env_file` del servicio `app` inyecta TODO el `.env` en el contenedor.
# Las tres claves del bloque `environment` prevalecen sobre el archivo (Docker Compose):
#   - NODE_ENV / PORT: runtime fijo
#   - COUCHDB_URL: dentro de la red Docker debe ser el hostname del servicio `couchdb`,
#     no 127.0.0.1 ni la IP pública. En el host, para scripts (npm run saas:bootstrap) sigue
#     usando en línea: COUCHDB_URL=http://127.0.0.1:5984 …
# Si Couch está fuera de este Compose, pon en `.env`: COUCHDB_URL_APP=http://host:5984

services:
  couchdb:
    image: couchdb:3.4
    restart: unless-stopped
    environment:
      COUCHDB_USER: ${COUCHDB_USER}
      COUCHDB_PASSWORD: ${COUCHDB_PASSWORD}
    volumes:
      - couchdb_data:/opt/couchdb/data
      - couchdb_etc:/opt/couchdb/etc/local.d
    # Solo localhost (más seguro, Fauxton vía SSH -L): "127.0.0.1:5984:5984"
    # Acceso Fauxton desde Internet (abrir 5984 en firewall del proveedor + ufw si aplica):
    ports:
      - "5984:5984"

  app:
    build:
      context: ..
      # VPS con poco disco: usa Dockerfile.prebuilt (sin npm run build ni devDependencies).
      # Requiere dist/ presente en el repo (git pull) o el build fallará.
      dockerfile: deploy/Dockerfile.prebuilt
    restart: unless-stopped
    depends_on:
      - couchdb
    env_file:
      - ../.env
    environment:
      NODE_ENV: production
      PORT: "3000"
      COUCHDB_URL: ${COUCHDB_URL_APP:-http://couchdb:5984}
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  couchdb_data:
  couchdb_etc:
