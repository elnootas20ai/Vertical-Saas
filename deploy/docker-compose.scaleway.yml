services:
  couchdb:
    image: couchdb:3.4
    restart: unless-stopped
    environment:
      COUCHDB_USER: ${COUCHDB_USER}
      COUCHDB_PASSWORD: ${COUCHDB_PASSWORD}
    volumes:
      - couchdb_data:/opt/couchdb/data
      - couchdb_etc:/opt/couchdb/etc/local.d
    # Solo localhost (más seguro, Fauxton vía SSH -L): "127.0.0.1:5984:5984"
    # Acceso Fauxton desde Internet (abrir 5984 en firewall del proveedor + ufw si aplica):
    ports:
      - "5984:5984"

  app:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - couchdb
    environment:
      NODE_ENV: production
      PORT: 3000
      APP_URL: ${APP_URL}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}

      # Couch vive en el servicio `couchdb` de esta misma red. NO uses aquí 127.0.0.1 ni la IP
      # pública del VPS: dentro del contenedor `app` no apuntan a Couch. Para scripts en el host
      # (npm run saas:bootstrap) sigue usando COUCHDB_URL=http://127.0.0.1:5984 en línea o en .env.
      # Si Couch está fuera de Compose, define COUCHDB_URL_APP con esa URL.
      COUCHDB_URL: ${COUCHDB_URL_APP:-http://couchdb:5984}
      COUCHDB_USER: ${COUCHDB_USER}
      COUCHDB_PASSWORD: ${COUCHDB_PASSWORD}
      COUCHDB_DB: ${COUCHDB_DB}

      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN}

      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL}
      OPENAI_TRANSCRIPTION_MODEL: ${OPENAI_TRANSCRIPTION_MODEL}
      OPENAI_SUMMARY_MODEL: ${OPENAI_SUMMARY_MODEL}

      RESEND_API_KEY: ${RESEND_API_KEY}
      EMAIL_FROM: ${EMAIL_FROM}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_SECURE: ${SMTP_SECURE}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM: ${SMTP_FROM}

      MONEI_API_KEY: ${MONEI_API_KEY}
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  couchdb_data:
  couchdb_etc:
