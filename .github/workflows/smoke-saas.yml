# Smoke test SaaS — solo manual (push desactivado; evita correos de error en cada commit).
# Secrets: SAAS_LOGIN_EMAIL, SAAS_LOGIN_PASSWORD, SMOKE_API_BASE (opcional)

name: Smoke SaaS

on:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Build frontend
        run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=8192

      - name: Comprobar credenciales smoke
        env:
          SAAS_LOGIN_EMAIL: ${{ secrets.SAAS_LOGIN_EMAIL }}
          SAAS_LOGIN_PASSWORD: ${{ secrets.SAAS_LOGIN_PASSWORD }}
        run: |
          if [ -z "$SAAS_LOGIN_EMAIL" ] || [ -z "$SAAS_LOGIN_PASSWORD" ]; then
            echo "::error::Configura SAAS_LOGIN_EMAIL y SAAS_LOGIN_PASSWORD en Secrets de Actions"
            exit 1
          fi

      - name: Smoke test (API remota)
        run: node scripts/smoke-saas.mjs
        env:
          SAAS_LOGIN_EMAIL: ${{ secrets.SAAS_LOGIN_EMAIL }}
          SAAS_LOGIN_PASSWORD: ${{ secrets.SAAS_LOGIN_PASSWORD }}
          SMOKE_API_BASE: ${{ secrets.SMOKE_API_BASE || 'https://vertialapp.com' }}
