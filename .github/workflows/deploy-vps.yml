# Despliega API + Couch (Docker) en tu VPS Scaleway en cada push a main.
# bump: commits trivial OK para disparar deploy sin tocar app
# Una vez en el VPS: repo clonado, .env en la raíz, clave pública en authorized_keys.
# GitHub → Settings → Secrets and variables → Actions:
#   VPS_HOST, VPS_USER, VPS_DEPLOY_PATH
#   Clave SSH: VPS_SSH_KEY (privada multilínea) **o** VPS_SSH_KEY_B64 (misma clave en Base64, una línea; útil desde Windows)
# Opcionales: VPS_PORT (si SSH no es 22)
# (Clave SSH dedicada solo para Actions; no uses tu clave personal.)

name: Deploy API (VPS)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-scaleway-vps
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # Si falta alguno, el fallo del SSH es críptico (~1–3 s). Esto falla con mensaje legible.
      - name: Comprobar que existen los secretos (sin mostrar valores)
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_SSH_KEY_B64: ${{ secrets.VPS_SSH_KEY_B64 }}
          VPS_DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
        run: |
          set -e
          missing=0
          for name in VPS_HOST VPS_USER VPS_DEPLOY_PATH; do
            v=$(printenv "$name" || true)
            if [ -z "$v" ]; then
              echo "::error::Falta el secreto de Actions '$name'. Repo → Settings → Secrets and variables → Actions."
              missing=1
            fi
          done
          k=$(printenv VPS_SSH_KEY || true)
          b=$(printenv VPS_SSH_KEY_B64 || true)
          if [ -z "$k" ] && [ -z "$b" ]; then
            echo "::error::Falta VPS_SSH_KEY o VPS_SSH_KEY_B64 (al menos uno con la clave privada)."
            missing=1
          fi
          if [ "$missing" != 0 ]; then exit 1; fi
          echo "OK: secretos obligatorios + clave SSH (texto o Base64)."

      # Falla en ~1s en appleboy = casi nunca es Docker/git: suele ser clave (CRLF al pegar en el
      # secreto), usuario/host/puerto o firewall. Normalizamos CRLF y reutilizamos el mismo
      # archivo para appleboy (key_path).
      - name: Preparar clave SSH (sin CRLF) y comprobar login
        id: ssh_prep
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_SSH_KEY_B64: ${{ secrets.VPS_SSH_KEY_B64 }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
        run: |
          set -euo pipefail
          KEYFILE="$RUNNER_TEMP/gh_vps_deploy_key"
          export KEYFILE
          python3 <<'PY'
          import base64, os, pathlib, sys

          keyfile = os.environ["KEYFILE"]
          b64 = (os.environ.get("VPS_SSH_KEY_B64") or "").strip()
          raw = os.environ.get("VPS_SSH_KEY") or ""

          if b64:
              try:
                  data = base64.standard_b64decode(b64)
              except Exception as e:
                  print(f"::error::VPS_SSH_KEY_B64 no decodifica (Base64 inválido): {e}")
                  sys.exit(1)
              pathlib.Path(keyfile).write_bytes(data)
          else:
              text = raw.replace("\r", "").lstrip("\ufeff")
              if "BEGIN" not in text:
                  print("::error::VPS_SSH_KEY no parece una privada (no contiene BEGIN). ¿Pegaste la línea ssh-ed25519 del .pub? Tiene que ser el archivo sin extensión (privada), o usa VPS_SSH_KEY_B64.")
                  sys.exit(1)
              if not text.endswith("\n"):
                  text += "\n"
              pathlib.Path(keyfile).write_text(text, encoding="utf-8")

          pathlib.Path(keyfile).chmod(0o600)
          PY
          echo "key_path=$KEYFILE" >> "$GITHUB_OUTPUT"
          echo ">>> Validando lectura de la clave (ssh-keygen -y)…"
          if ! ssh-keygen -y -f "$KEYFILE" >/dev/null 2>&1; then
            echo "::error::La clave no es legible para ssh-keygen. Crea el secreto VPS_SSH_KEY_B64 con la salida de PowerShell: [Convert]::ToBase64String([IO.File]::ReadAllBytes('RUTA\\clave')) (un solo renglón). Si usas B64, puede quedar solo ese secreto para la clave."
            exit 1
          fi
          echo ">>> Probando SSH a ${VPS_USER}@${VPS_HOST} puerto ${VPS_PORT} (BatchMode, timeout 25s)..."
          if ! ssh -o BatchMode=yes -o ConnectTimeout=25 -o StrictHostKeyChecking=accept-new \
              -p "${VPS_PORT}" -i "$KEYFILE" \
              "${VPS_USER}@${VPS_HOST}" 'echo gh-deploy-ssh-ok'; then
            echo "::error::No se pudo autenticar por SSH. Revisa: VPS_USER/VPS_HOST; secreto opcional VPS_PORT si SSH no es 22; la pública del par en authorized_keys del usuario; firewall del VPS hacia rangos de GitHub Actions."
            exit 1
          fi
          echo "OK: SSH llega al servidor y acepta la clave."

      - name: SSH — git pull + Docker Compose
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key_path: ${{ steps.ssh_prep.outputs.key_path }}
          port: ${{ secrets.VPS_PORT || '22' }}
          command_timeout: 40m
          debug: true
          script_stop: true
          script: |
            set -ex
            echo ">>> whoami=$(whoami) shell=$0"
            command -v git || true
            command -v docker || true
            test -d "${{ secrets.VPS_DEPLOY_PATH }}" || { echo "ERROR: VPS_DEPLOY_PATH no es un directorio"; exit 1; }
            test -f "${{ secrets.VPS_DEPLOY_PATH }}/.git/config" || { echo "ERROR: no hay repo git en VPS_DEPLOY_PATH"; exit 1; }
            cd "${{ secrets.VPS_DEPLOY_PATH }}"
            echo ">>> remote:" && git remote -v || true
            git fetch origin
            echo ">>> reset to ${{ github.sha }} (ref ${{ github.ref }})"
            git reset --hard "${{ github.sha }}"
            docker compose version || true
            docker compose -f deploy/docker-compose.scaleway.yml --env-file .env build
            docker compose -f deploy/docker-compose.scaleway.yml --env-file .env up -d
            docker compose -f deploy/docker-compose.scaleway.yml ps
