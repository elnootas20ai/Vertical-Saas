# Despliegue automático al VPS — DESACTIVADO en push (deploy real: npm run deploy:all desde tu PC).
# Si quieres usarlo: Actions → Deploy API (VPS) → Run workflow (manual).
# Requiere secretos: VPS_HOST, VPS_USER, VPS_SSH_KEY, VPS_DEPLOY_PATH

name: Deploy API (VPS)

on:
  workflow_dispatch:

concurrency:
  group: deploy-scaleway-vps
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # Si falta alguno, el fallo del SSH es criptico (~1-3 s). Esto falla con mensaje legible.
      - name: Comprobar que existen los secretos (sin mostrar valores)
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
        run: |
          set -e
          missing=0
          for name in VPS_HOST VPS_USER VPS_SSH_KEY VPS_DEPLOY_PATH; do
            v=$(printenv "$name" || true)
            if [ -z "$v" ]; then
              echo "::error::Falta el secreto de Actions '$name'. Repo - Settings - Secrets and variables - Actions. Nombres exactos: VPS_HOST, VPS_USER, VPS_SSH_KEY, VPS_DEPLOY_PATH"
              missing=1
            fi
          done
          if [ "$missing" != 0 ]; then exit 1; fi
          echo "OK: los cuatro secretos tienen contenido."

      - name: SSH - git pull + Docker Compose
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 40m
          debug: true
          script_stop: true
          script: |
            set -ex
            echo ">>> whoami=$(whoami) shell=$0"
            command -v git || true
            command -v docker || true
            test -d "${{ secrets.VPS_DEPLOY_PATH }}" || { echo "ERROR: VPS_DEPLOY_PATH no es un directorio"; exit 1; }
            test -f "${{ secrets.VPS_DEPLOY_PATH }}/.git/config" || { echo "ERROR: no hay repo git en VPS_DEPLOY_PATH"; exit 1; }
            cd "${{ secrets.VPS_DEPLOY_PATH }}"
            echo ">>> remote:" && git remote -v || true
            git fetch origin
            echo ">>> reset to ${{ github.sha }} (ref ${{ github.ref }})"
            git reset --hard "${{ github.sha }}"
            docker compose version || true
            docker compose -f deploy/docker-compose.scaleway.yml --env-file .env build app
            docker compose -f deploy/docker-compose.scaleway.yml --env-file .env up -d --wait app
            docker compose -f deploy/docker-compose.scaleway.yml ps
